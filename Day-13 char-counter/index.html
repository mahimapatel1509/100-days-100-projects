<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day 13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <h1>Word Counter</h1>
    <p>Instantly analyze your text for word count, character count, sentences, and paragraphs.</p>

    <textarea name="" placeholder="Start typing or paste your code here... "  id=""></textarea>

    <div class="outputs">
        <div class="words box">
            <h2>Words</h2>
            <p class="word"></p>
        </div>
        <div class="chars box ">
            <h2>Characters</h2>
            <p class="char"></p>
        </div>
        <div class="sentences box ">
            <h2>Sentences</h2>
            <p class="sentence"></p>
        </div>
    </div>

</div>


    <script src="script.js"></script>
</body>
</html>
